<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sigen-sankey harness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=block">
<style>
  /* Mimic the tablet dashboard: dark theme, Roboto, card #1c1c1c */
  html, body { margin: 0; background: #111111; font-family: Roboto, sans-serif; color: #e1e1e1; }
  body { padding: 8px; }
  .slot { width: 846px; margin-bottom: 12px; }
  .cap { font: 12px monospace; color: #888; margin: 0 0 4px; }
  ha-card { display: block; background: #1c1c1c; border-radius: 12px; overflow: hidden; }
  :root { --primary-color: #03a9f4; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { SCENARIOS, mitchConfig, proposedConfig, mockHass } from './scenarios.js';

  // Stand-in for HA's ha-card; HA's theme sets line-height 1.6, which the card inherits
  customElements.define('ha-card', class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' }).innerHTML =
        '<style>:host{display:block;background:#1c1c1c;border-radius:12px;line-height:1.6;}</style><slot></slot>';
    }
  });

  const params = new URLSearchParams(location.search);
  const build = params.get('build') || 'current';
  const cfgName = params.get('cfg') || 'proposed';
  const only = params.get('s');
  const overrides = params.get('o') ? JSON.parse(params.get('o')) : {};

  // baseline.js: copy of a previous build to compare against (gitignored)
  await import(build === 'baseline' ? './baseline.js' : '../../dist/sigen-sankey.js');
  await document.fonts.ready;

  const root = document.getElementById('root');
  for (const [name, values] of Object.entries(SCENARIOS)) {
    if (only && !only.split(',').includes(name)) continue;
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.scenario = name;
    slot.innerHTML = `<p class="cap">${name} ${JSON.stringify(values)}</p>`;
    const card = document.createElement('sigen-sankey');
    const config = { ...(cfgName === 'mitch' ? mitchConfig() : proposedConfig()), ...overrides };
    card.setConfig(config, true);
    card.hass = mockHass(values);
    slot.appendChild(card);
    root.appendChild(slot);
  }
  await new Promise(r => setTimeout(r, 400));
  document.body.dataset.ready = '1';
</script>
</body>
</html>
